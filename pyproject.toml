[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimusic"
version = "0.1.0"
description = "Describe music in plain English; generate it with open-source models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Each backend is optional. Backends pin different torch/transformers versions,
# so install only one per virtual environment.
musicgen = ["torch", "torchaudio", "transformers>=4.40", "accelerate"]
acestep = []          # installed separately (own venv); see README
ui = ["gradio>=5"]    # local web UI: `aimusic ui`
dev = ["pytest"]

[project.scripts]
aimusic = "aimusic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aimusic"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
